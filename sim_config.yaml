# 시뮬레이터 실행 설정 (PC 사양에 맞춰 고른다)
# - ./scripts/robotworld start · drive · slam · moveit 가 실행할 때마다 이 파일을 읽는다.
# - 고친 뒤 다시 실행하면 바로 반영된다 (colcon build 필요 없음).
# - 명령줄 인자(예: profile:=low, rviz:=false)가 이 파일보다 우선한다.

# high : 로봇을 실제 메시로 · 카메라 영상에 그림자 · RViz 15 FPS      (기본, 지금까지 쓰던 설정)
# low  : 뷰어의 로봇을 단순 형상으로 · 카메라 그림자 끔 · RViz 10 FPS  (내장 그래픽 · 저사양 노트북)
# 두 단계 모두 뷰어 그림자는 끄고, 카메라는 2대(base · head) 320x240 2 FPS 로 같다.
profile: high

viewer: true      # MuJoCo 창
rviz: true        # RViz 창 (FMS 웹 화면만 쓸 때는 false 로 더 가볍게)

# 아래는 비워 두면 profile 값을 따른다. 한 항목만 바꾸고 싶을 때 적는다.
viewer_shadows:   # true | false
viewer_meshes:    # visual(실제 메시) | simple(충돌 형상, 삼각형 약 1/23)
camera_shadows:   # true | false
camera_names:     # 예: base_camera,head_camera
camera_size:      # 예: 320x240
camera_fps:       # 예: 2
rviz_fps:         # 예: 15
