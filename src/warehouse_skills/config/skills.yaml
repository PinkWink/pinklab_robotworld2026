# 운반 스킬 파라미터. 거리는 m, 각도는 rad. 좌표는 base_footprint 기준(dx 앞, dy 왼쪽).
dock:
  # Nav2는 locations.yaml의 base_goal(사전 도킹 지점)까지만. 그 뒤는 ArUco 마커 기준 시각 서보.
  target_dx: 0.47        # 도킹 완료 시 base_footprint에서 마커 평면까지 전방 거리. 부스의 마커는 테이블 가장자리에 있으므로
                         # 로봇 중심 → 가장자리 0.47 m (강좌 창고와 같은 팔 도달 거리: 물체까지 0.47 + 0.055)
  visual_end_dx: 0.80    # 이 거리(카메라에서 0.47m)부터는 바깥 마커가 시야를 벗어나므로 오도메트리로 직진
  max_speed: 0.10
  blind_speed: 0.06
  gain: 0.6
  lateral_gain: 1.2
  heading_gain: 0.4
  timeout_s: 180.0
  max_lateral_error: 0.05   # 이보다 크면 오도메트리 옆걸음(90° 회전-직진-복귀) 후 서보 시작
  undock_distance: 0.75  # 작업 후 후진 거리 (Nav2 팽창 영역 밖으로)
stations:                # 테이블 가장자리 · 방향 · 높이는 mobile_openarm_mujoco/worlds/booth.yaml 의 stations
  drinks:    {markers: [0, 1], slots: [0.15, 0.0, -0.15]}
  consult_1: {markers: [2, 3], slots: [0.0, 0.10, -0.10]}     # 둥근 테이블(반지름 0.3): 가운데부터
  consult_2: {markers: [4, 5], slots: [0.0, 0.10, -0.10]}
grasp:
  pre_offset_x: -0.10    # 물체 중심 기준 접근 시작점 (뒤쪽). IK 실패 시 0.6배, 0.3배로 줄여 재시도
  lift_z: 0.04
  retreat_x: -0.14
  z_offset: 0.02         # tcp 높이 = 물체 중심 + 2cm: 손가락이 tcp 아래 3cm까지 내려오므로 상판과 2cm 여유
  open: 0.044
  close: 0.012           # 50 mm 컵이면 0.025 에서 멈춤(stalled) → 성공으로 판정
  close_min: 0.016
  close_max: 0.028
  effort: 25.0
place:
  pre_offset_x: -0.12
  drop_z: 0.004          # 놓을 때 상자 바닥과 상판 사이 간격
  slot_offsets_y: [-0.25, 0.0, 0.25]   # 마커(작업대 중심) 기준 놓는 자리 y 오프셋
  x_from_edge: 0.055     # 작업대 앞 가장자리에서 안쪽으로 (object_x = 2.125 + 0.055)
moveit:
  planning_time: 5.0
  attempts: 4
  velocity_scaling: 0.35
  acceleration_scaling: 0.35
  ik_attempts: 12
  cartesian_step: 0.01
  cartesian_min_fraction: 0.9
transport_pose: transport
carry_pose: hands_up     # tcp 0.86m: 컵(바닥 0.795 m)이 베이스 상판과 테이블 상판(0.72 ~ 0.75 m)에 닿지 않는다. drive_poses.yaml에 있어야 함
arms:
  left: {shoulder_y: 0.093, tcp_link: openarm_left_hand_tcp, group: left_arm, gripper: left_gripper_controller, hand_link: openarm_left_hand}
  right: {shoulder_y: -0.093, tcp_link: openarm_right_hand_tcp, group: right_arm, gripper: right_gripper_controller, hand_link: openarm_right_hand}
objects:
  cup_pink:   {color: pink, size: [0.05, 0.05, 0.09]}       # 원기둥 컵 (지름 5 cm: 손가락 하나 25 mm 에서 멈춤)
  cup_blue:   {color: blue, size: [0.05, 0.05, 0.09]}
  cup_yellow: {color: yellow, size: [0.05, 0.05, 0.09]}
